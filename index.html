<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f8f6" />
    <meta name="description" content="Registra tus ingresos y gastos, consulta el balance de cada mes y guarda tus movimientos en tu dispositivo." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mi Dinero" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch.png" />
    <title>Mi Dinero</title>
    <style>
      .startup {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        background: var(--canvas, #f6f8f6);
        color: var(--text, #182d2b);
        text-align: center;
        font-family: system-ui, sans-serif;
        transition: opacity 180ms ease-out, visibility 180ms;
      }
      :root[data-theme="dark"] .startup { background: var(--canvas, #111b1a); color: var(--text, #edf4ef); }
      :root[data-app-ready] .startup { opacity: 0; visibility: hidden; pointer-events: none; }
      .startup img { display: block; margin: 0 auto 16px; border-radius: 20px; }
      .startup strong { display: block; font-size: 28px; letter-spacing: -.04em; }
      .startup small { display: block; margin-top: 8px; font-size: 13px; opacity: .75; }
      @media (prefers-reduced-motion: reduce) { .startup { transition: none; } }
    </style>
    <noscript><style>.startup { display: none; }</style></noscript>
    <script>
      try {
        var choice = localStorage.getItem('mi-dinero:theme')
        var design = localStorage.getItem('mi-dinero:design')
        var custom = ['midnight', 'graphite', 'plum', 'sand', 'one-piece-elbaph', 'one-piece-luna', 'one-piece-alba', 'one-piece-wano'].includes(design)
        if (custom) document.documentElement.dataset.design = design
        var dark = custom ? design !== 'sand' : choice === 'dark' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch {}
    </script>
    <link rel="stylesheet" href="/src/designs.css" />
  </head>
  <body>
    <div class="startup" role="status" aria-label="Cargando Mi Dinero">
      <div>
        <img src="./icons/icon-192.png" alt="" width="76" height="76" />
        <strong>Mi Dinero</strong>
        <small>Powered by diegogonzalez7</small>
      </div>
    </div>
    <div id="root"></div>
    <noscript>Activa JavaScript para usar Mi Dinero.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
